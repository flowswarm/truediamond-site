<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071527"/><stop offset=".55" stop-color="#0b1f3a"/><stop offset="1" stop-color="#163055"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c9a84c" stop-opacity=".22"/><stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3cf8f"/><stop offset="1" stop-color="#a8862f"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f8f5ee" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <!-- faint diamond watermark -->
  <g transform="translate(1050,545) scale(1.2)" fill="none" stroke="#c9a84c" stroke-opacity=".10" stroke-width="3">
    <path d="M-60 -20 L-30 -60 L30 -60 L60 -20 L0 60 Z"/><path d="M-60 -20 H60 M-30 -60 L0 -20 L30 -60 M0 -20 V60"/>
  </g>
  <circle cx="600.0" cy="337.5" r="229.50000000000003" fill="url(#halo)"/>
  <circle cx="600.0" cy="337.5" r="270.0" fill="none" stroke="#c9a84c" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="600.0" cy="337.5" r="310.5" fill="none" stroke="#c9a84c" stroke-opacity=".12" stroke-width="2" stroke-dasharray="6 10"/>
  <g fill="none" stroke="#e3cf8f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">

    <!-- vault / safeguarding -->
    <g transform="translate(330,330)">
      <rect x="-150" y="-150" width="300" height="300" rx="24" fill="#163055" fill-opacity=".85"/>
      <circle r="80"/>
      <circle r="24" fill="#c9a84c" stroke="none"/>
      <path d="M0 -80 V-110 M0 80 V110 M-80 0 H-110 M80 0 H110 M-57 -57 L-78 -78 M57 57 L78 78 M-57 57 L-78 78 M57 -57 L78 -78" stroke-width="8"/>
    </g>
    <!-- ledger -->
    <g transform="translate(720,190)">
      <rect x="0" y="0" width="300" height="320" rx="14" fill="#163055" fill-opacity=".85"/>
      <path d="M40 60 H260 M40 110 H180 M40 160 H200 M40 210 H170 M40 260 H260" stroke-width="7"/>
      <path d="M210 100 L240 120 L210 140 M205 150 L240 170 L205 190" stroke-width="6" stroke-opacity=".7"/>
      <circle cx="245" cy="258" r="14" fill="#c9a84c" stroke="none"/>
    </g>
    <!-- bar chart: monitoring income & expenses -->
    <path d="M740 600 H1060" stroke-width="8"/>
    <rect x="770" y="545" width="50" height="55" rx="6" fill="#c9a84c" stroke="none"/>
    <rect x="850" y="520" width="50" height="80" rx="6" fill="#e3cf8f" stroke="none"/>
    <rect x="930" y="555" width="50" height="45" rx="6" fill="#c9a84c" stroke="none"/>
    <!-- shield with check: accountability -->
    <path transform="translate(560,560) scale(0.5)" d="M0 -120 L105 -78 V0 C105 72 50 118 0 140 C-50 118 -105 72 -105 0 V-78 Z" fill="#163055" stroke="#e3cf8f"/>
    <path transform="translate(560,560) scale(0.9)" d="M-34 4 L-8 30 L40 -28"/>

  </g>
</svg>
