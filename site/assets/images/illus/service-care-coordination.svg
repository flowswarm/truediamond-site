<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071527"/><stop offset=".55" stop-color="#0b1f3a"/><stop offset="1" stop-color="#163055"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c9a84c" stop-opacity=".22"/><stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3cf8f"/><stop offset="1" stop-color="#a8862f"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f8f5ee" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <!-- faint diamond watermark -->
  <g transform="translate(1050,545) scale(1.2)" fill="none" stroke="#c9a84c" stroke-opacity=".10" stroke-width="3">
    <path d="M-60 -20 L-30 -60 L30 -60 L60 -20 L0 60 Z"/><path d="M-60 -20 H60 M-30 -60 L0 -20 L30 -60 M0 -20 V60"/>
  </g>
  <circle cx="600.0" cy="337.5" r="229.50000000000003" fill="url(#halo)"/>
  <circle cx="600.0" cy="337.5" r="270.0" fill="none" stroke="#c9a84c" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="600.0" cy="337.5" r="310.5" fill="none" stroke="#c9a84c" stroke-opacity=".12" stroke-width="2" stroke-dasharray="6 10"/>
  <g fill="none" stroke="#e3cf8f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">

    <!-- spokes -->
    <path d="M600 338 L300 170 M600 338 L900 170 M600 338 L240 480 M600 338 L960 480 M600 338 L600 590" stroke-width="6" stroke-dasharray="4 18"/>
    <!-- centre: the individual -->
    <circle cx="600" cy="338" r="95" fill="#163055"/>
    <g transform="translate(600,270) scale(0.55)" stroke="none" fill="#f8f5ee">
      <circle cx="0" cy="34" r="34"/>
      <path d="M-70 170 C-70 108 -38 84 0 84 C38 84 70 108 70 170 Z"/>
    </g>
    <!-- hospital -->
    <g transform="translate(300,170)"><circle r="70" fill="#163055"/><path d="M-18 -40 H18 V-18 H40 V18 H18 V40 H-18 V18 H-40 V-18 H-18 Z" fill="#c9a84c" stroke="none"/></g>
    <!-- residence -->
    <g transform="translate(900,170)"><circle r="70" fill="#163055"/><path d="M-44 4 L0 -36 L44 4 M-32 -6 V38 H32 V-6" /><rect x="-10" y="12" width="20" height="26" fill="#c9a84c" stroke="none"/></g>
    <!-- social worker / care team -->
    <g transform="translate(240,480)"><circle r="70" fill="#163055"/>    <g transform="translate(0,-45) scale(0.3)" stroke="none" fill="#c9a84c">
      <circle cx="0" cy="34" r="34"/>
      <path d="M-70 170 C-70 108 -38 84 0 84 C38 84 70 108 70 170 Z"/>
    </g></g>
    <!-- community resources -->
    <g transform="translate(960,480)"><circle r="70" fill="#163055"/><path d="M-36 20 H36 M-28 20 V-10 H28 V20 M0 -10 V-38 M-14 -24 H14" /><circle cx="0" cy="-40" r="8" fill="#c9a84c" stroke="none"/></g>
    <!-- quality of life: heart -->
    <g transform="translate(600,590)"><circle r="60" fill="#163055"/>    <path transform="translate(0,8) scale(0.8)" fill="#c9a84c" stroke="none" d="M0 40 C-60 0 -60 -50 -30 -50 C-14 -50 -4 -40 0 -30 C4 -40 14 -50 30 -50 C60 -50 60 0 0 40 Z"/></g>

  </g>
</svg>
