<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071527"/><stop offset=".55" stop-color="#0b1f3a"/><stop offset="1" stop-color="#163055"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c9a84c" stop-opacity=".22"/><stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3cf8f"/><stop offset="1" stop-color="#a8862f"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f8f5ee" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <!-- faint diamond watermark -->
  <g transform="translate(1050,545) scale(1.2)" fill="none" stroke="#c9a84c" stroke-opacity=".10" stroke-width="3">
    <path d="M-60 -20 L-30 -60 L30 -60 L60 -20 L0 60 Z"/><path d="M-60 -20 H60 M-30 -60 L0 -20 L30 -60 M0 -20 V60"/>
  </g>
  <circle cx="600.0" cy="337.5" r="229.50000000000003" fill="url(#halo)"/>
  <circle cx="600.0" cy="337.5" r="270.0" fill="none" stroke="#c9a84c" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="600.0" cy="337.5" r="310.5" fill="none" stroke="#c9a84c" stroke-opacity=".12" stroke-width="2" stroke-dasharray="6 10"/>
  <g fill="none" stroke="#e3cf8f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">

    <!-- medical cross -->
    <g transform="translate(600,300)">
      <circle r="150" fill="#163055" fill-opacity=".8"/>
      <path d="M-40 -100 H40 V-40 H100 V40 H40 V100 H-40 V40 H-100 V-40 H-40 Z" fill="#c9a84c" stroke="none"/>
    </g>
    <!-- heartbeat line -->
    <path d="M90 520 H330 L380 440 L430 600 L480 480 L520 560 L560 520 H640 L680 460 L720 580 L770 520 H1110" stroke-width="8"/>
    <!-- stethoscope -->
    <g transform="translate(250,250)">
      <path d="M-70 -120 V-20 C-70 40 -20 70 10 70 C40 70 90 40 90 -20 V-120"/>
      <path d="M10 70 V120 C10 170 60 190 100 190 C140 190 180 160 180 120 V60" />
      <circle cx="180" cy="40" r="26" fill="#c9a84c" stroke="none"/>
    </g>
    <!-- care plan clipboard -->
    <path d="M890 160 H1030 L1070 200 V390 H890 Z" fill="#163055" fill-opacity=".7"/>
    <path d="M1030 160 V200 H1070"/>

    <rect x="940" y="140" width="80" height="40" rx="10" fill="#c9a84c" stroke="none"/>
    <path transform="translate(935,235) scale(0.7)" d="M-34 4 L-8 30 L40 -28"/>    <path d="M985 235 H1045" stroke-width="7"/>
    <path transform="translate(935,290) scale(0.7)" d="M-34 4 L-8 30 L40 -28"/>    <path d="M985 290 H1045" stroke-width="7"/>
    <path transform="translate(935,345) scale(0.7)" d="M-34 4 L-8 30 L40 -28"/>    <path d="M985 345 H1045" stroke-width="7"/>

  </g>
</svg>
